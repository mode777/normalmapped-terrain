schema: spec-driven

context: |
  Read AGENTS.md first; its render invariants are non-negotiable.
  This is a visual WebGL renderer: a green build does not prove the scene
  renders. Visual changes need the headless QA loop in docs/VERIFICATION.md.
  Commit after syncing specs.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - When apply is done, always commit the completed change and merge it
        into the integration branch (normally main) before handing off.
      - Push the integration branch to origin after every successful apply.
        A push to main triggers the Pages deploy workflow; never leave a
        completed apply as local-only commits.
  archive:
    guidance:
      - Archive completed changes on main by default, and commit after archiving.
      - Push the archive commit as well, so the deployed site follows main.
